<style>
/* Layout: mapa a pantalla completa + panel lateral (hoja deslizable en el celular). Atlas: mar frío, tierra de papel, tinta verde-azulada. */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --surface-2: #e9eee9;
  --ink: #18272c;
  --muted: #5a6a6f;
  --line: #d6ded9;
  --sea: #cad9df;
  --grat: #b9cbd2;
  --land: #f7f6f0;
  --land-inv: #e3e8dc;
  --land-out: #ecebe4;
  --border: #9fb0aa;
  --accent: #0d5c69;
  --accent-soft: #d5e8ea;
  --visitado: #2a8a5c;
  --quiero: #2d68c9;
  --talvez: #c98a12;
  --neutro: #50626a;
  --adr: #d9432a;
  --warn-bg: #fdf1dc;
  --warn-ink: #7a4d00;
  --rama1: #0d5c69; --rama2: #8c5a2b; --rama3: #5d6b1f; --rama4: #7a3b6b; --rama5: #2f5a96; --rama6: #9a3d32;
  --shadow: 0 1px 2px rgb(16 32 38 / .08), 0 6px 20px rgb(16 32 38 / .10);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --panel-w: 410px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f171a; --surface: #152126; --surface-2: #1b2a30; --ink: #e3ebe8; --muted: #93a4a8; --line: #26363c;
  --sea: #0a161c; --grat: #13252d; --land: #1a262b; --land-inv: #22333a; --land-out: #162024; --border: #3b4f56;
  --accent: #5ec2cc; --accent-soft: #163b42; --visitado: #4cc28a; --quiero: #6b9cff; --talvez: #f0b648; --neutro: #8fa3aa; --adr: #ff6b4f;
  --warn-bg: #3a2c10; --warn-ink: #f6d28c;
  --rama1: #5ec2cc; --rama2: #e0a46a; --rama3: #b4c45a; --rama4: #d58ac4; --rama5: #84aef0; --rama6: #ef8c7d;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f171a; --surface: #152126; --surface-2: #1b2a30; --ink: #e3ebe8; --muted: #93a4a8; --line: #26363c;
  --sea: #0a161c; --grat: #13252d; --land: #1a262b; --land-inv: #22333a; --land-out: #162024; --border: #3b4f56;
  --accent: #5ec2cc; --accent-soft: #163b42; --visitado: #4cc28a; --quiero: #6b9cff; --talvez: #f0b648; --neutro: #8fa3aa; --adr: #ff6b4f;
  --warn-bg: #3a2c10; --warn-ink: #f6d28c;
  --rama1: #5ec2cc; --rama2: #e0a46a; --rama3: #b4c45a; --rama4: #d58ac4; --rama5: #84aef0; --rama6: #ef8c7d;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* barra superior */
.top { display: flex; align-items: center; gap: 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 1001; }
.marca { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.marca h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 21px; letter-spacing: .2px; white-space: nowrap; }
.marca .rosa { width: 22px; height: 22px; align-self: center; color: var(--accent); flex: none; }
.buscar { position: relative; flex: 1; max-width: 420px; min-width: 0; }
.buscar input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px 8px 34px; outline: none; }
.buscar input:focus { border-color: var(--accent); }
.buscar svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.sugerencias { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; margin: 0; list-style: none; max-height: 340px; overflow: auto; }
.sugerencias li { padding: 7px 10px; border-radius: 6px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.sugerencias li[aria-selected="true"], .sugerencias li:hover { background: var(--accent-soft); }
.sugerencias small { color: var(--muted); margin-left: auto; white-space: nowrap; }
.totales { display: flex; gap: 14px; margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.totales b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.totales .t { display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--neutro); }
.dot.e-visitado { background: var(--visitado); } .dot.e-quiero_ir { background: var(--quiero); } .dot.e-tal_vez { background: var(--talvez); }

.main { display: grid; grid-template-columns: 1fr var(--panel-w); min-height: 0; }
.mapa-wrap { position: relative; min-width: 0; min-height: 0; }
#mapa { position: absolute; inset: 0; background: var(--sea); }
.leaflet-container { font-family: var(--f-body); background: var(--sea); }
.agregando #mapa { cursor: crosshair; }

/* filtros sobre el mapa */
.filtros { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 900; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
.filtros > * { pointer-events: auto; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 3px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.sel { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px 28px 6px 10px; font-size: 13px; box-shadow: var(--shadow); appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 13px top 50%, right 8px top 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.btn-adr { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px; font-size: 13px; box-shadow: var(--shadow); }
.btn-adr svg { width: 15px; height: 15px; color: var(--adr); }
.btn-adr[aria-pressed="true"] { background: var(--adr); color: #fff; border-color: var(--adr); }
.btn-adr[aria-pressed="true"] svg { color: #fff; }
.aviso-mapa { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 950; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.aviso-mapa button { background: none; border: 1px solid currentColor; border-radius: 999px; padding: 2px 10px; font-size: 12px; }

/* leyenda */
.leyenda { position: absolute; left: 12px; bottom: 22px; z-index: 900; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 12px; display: grid; gap: 6px; }
.leyenda .fila { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.leyenda .it { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.leyenda .tam { display: inline-block; border-radius: 50%; background: var(--neutro); border: 1.5px solid var(--surface); box-shadow: 0 0 0 1px var(--border); }

/* pines y clusters */
.pin-wrap { background: none; border: 0; }
.pin { width: var(--s); height: var(--s); border-radius: 50%; display: grid; place-items: center; background: var(--neutro); color: #fff; border: 2px solid var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .35); box-sizing: border-box; transition: transform .15s ease; position: relative; }
.pin svg { width: 58%; height: 58%; }
.pin.e-visitado { background: var(--visitado); } .pin.e-quiero_ir { background: var(--quiero); } .pin.e-tal_vez { background: var(--talvez); }
.pin.e-visitado::after { content: ""; position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2.5px var(--visitado); }
.pin.propio { border-radius: 6px; transform: rotate(45deg); }
.pin.propio svg { transform: rotate(-45deg); }
.pin-wrap:hover .pin { transform: scale(1.15); }
.pin-wrap:hover .pin.propio { transform: rotate(45deg) scale(1.15); }
.pin-label { position: absolute; left: 50%; top: calc(100% + 2px); transform: translateX(-50%); white-space: nowrap; font-size: 11.5px; font-weight: 600; color: var(--ink); text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 2px var(--land); pointer-events: none; display: none; }
.z-labels .pin-label { display: block; }
.cluster { width: var(--s); height: var(--s); border-radius: 50%; display: grid; place-items: center; box-shadow: 0 1px 4px rgb(0 0 0 / .3); }
.cluster span { width: calc(var(--s) - 10px); height: calc(var(--s) - 10px); border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500; font-size: 12.5px; color: var(--ink); }
.adr-pin { width: 22px; height: 22px; border-radius: 6px; background: var(--adr); color: #fff; display: grid; place-items: center; border: 2px solid var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .35); box-sizing: border-box; }
.adr-pin svg { width: 13px; height: 13px; }
.foco { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--accent); box-sizing: border-box; animation: latido 1.6s ease-out infinite; pointer-events: none; }
@keyframes latido { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }

/* burbujas por país */
.burbuja-wrap { background: none; border: 0; }
.burbuja { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; white-space: nowrap; }

.leaflet-tooltip.tt { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px 10px; font-size: 12.5px; }
.leaflet-tooltip.tt::before { display: none; }
.tt b { font-family: var(--f-display); font-weight: 400; font-size: 14px; }
.tt small { color: var(--muted); display: block; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.4; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.pop h4 { margin: 0 0 2px; font-family: var(--f-display); font-weight: 400; font-size: 15px; }
.pop .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.pop .acc { display: flex; gap: 8px; flex-wrap: wrap; }
.leaflet-control-zoom a, .leaflet-bar a { background: var(--surface); color: var(--ink); border-color: var(--line); }

.leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted); font-size: 10.5px; }
.leaflet-control-attribution a { color: var(--muted); }

/* panel */
.panel { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; z-index: 1000; }

.volver { justify-self: start; display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--accent); padding: 2px 0; font-size: 13px; font-weight: 600; }
.ceja { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.1; text-wrap: balance; }
.panel h3 { margin: 0; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; }
.grupo { display: grid; gap: 8px; }
.barra-estado { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.barra-estado i { display: block; height: 100%; }
.cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cifra { background: var(--bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }

.muestra { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; }

.lista-paises { list-style: none; margin: 0; padding: 0; display: grid; }
.lista-paises li button { width: 100%; display: grid; grid-template-columns: 1fr auto 60px; gap: 10px; align-items: center; border: 0; background: none; padding: 8px 6px; border-radius: 8px; text-align: left; }

.mini { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.mini i { display: block; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.nivel-tit { display: flex; align-items: baseline; justify-content: space-between; }
.lugares { list-style: none; margin: 0; padding: 0; display: grid; }
.lugares li button { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; border: 0; background: none; padding: 9px 6px; border-radius: 8px; text-align: left; }
.lugares li button:hover { background: var(--bg); }
.lugares .nom { font-weight: 600; display: block; }

.vacio { color: var(--muted); font-size: 13px; padding: 8px 0; }

.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.n-imprescindible { background: var(--accent); color: var(--surface); }
.chip.n-muy_recomendado { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.cabecera-lugar { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
.nota { text-align: center; display: grid; gap: 2px; }
.nota b { font-family: var(--f-mono); font-weight: 500; font-size: 30px; line-height: 1; color: var(--accent); }
.nota span { font-size: 11px; color: var(--muted); }
.estados { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.estados button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 6px; font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; justify-content: center; }
.estados button[aria-pressed="true"][data-estado="visitado"] { border-color: var(--visitado); background: color-mix(in srgb, var(--visitado) 16%, var(--surface)); }
.estados button[aria-pressed="true"][data-estado="quiero_ir"] { border-color: var(--quiero); background: color-mix(in srgb, var(--quiero) 16%, var(--surface)); }
.estados button[aria-pressed="true"][data-estado="tal_vez"] { border-color: var(--talvez); background: color-mix(in srgb, var(--talvez) 18%, var(--surface)); }
.campo { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.campo input, .campo textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--ink); font-size: 14px; }
.campo textarea { min-height: 64px; resize: vertical; }
.por-que { font-size: 15px; line-height: 1.55; margin: 0; max-width: 62ch; }
.barras { display: grid; gap: 7px; }
.barra { display: grid; grid-template-columns: 92px 1fr 30px; gap: 10px; align-items: center; font-size: 12.5px; }
.barra .riel { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.barra .riel i { display: block; height: 100%; background: color-mix(in srgb, var(--accent) 55%, var(--surface)); border-radius: 99px; }
.barra.mejor .riel i { background: var(--accent); }
.barra.mejor span:first-child { font-weight: 700; }
.barra.sin-eval span:first-child, .barra.sin-eval b { color: var(--muted); }
.barra b { font-family: var(--f-mono); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.meses { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.meses span { text-align: center; font-size: 10.5px; padding: 5px 0; border-radius: 5px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.meses span.si { background: var(--accent); color: var(--surface); }
.datos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
.datos div { display: grid; gap: 1px; min-width: 0; }
.datos dt { font-size: 11.5px; color: var(--muted); }
.datos dd { margin: 0; font-weight: 600; }
.alerta { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.adr-lista, .fuentes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.adr-lista li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.adr-lista .ico { width: 26px; height: 26px; border-radius: 7px; background: color-mix(in srgb, var(--adr) 15%, var(--surface)); color: var(--adr); display: grid; place-items: center; }
.adr-lista .ico svg { width: 14px; height: 14px; }
.adr-lista small { color: var(--muted); display: block; }
.adr-lista .km { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.fuentes a { display: flex; justify-content: space-between; gap: 10px; text-decoration: none; padding: 7px 10px; border-radius: 8px; background: var(--bg); color: var(--ink); }

.acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.peligro { color: var(--adr); }
details.como summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--accent); }
details.como p, details.como li { font-size: 13px; color: var(--muted); }
details.como ul { padding-left: 18px; margin: 6px 0; }

/* mapa mental */
.mente-ctl { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.mente { width: 100%; overflow: hidden; }
.mente svg { display: block; width: 100%; height: auto; }
.mente text { fill: var(--ink); font-family: var(--f-body); }
.mente .raiz rect { fill: var(--accent); }
.mente .raiz text { fill: var(--surface); font-family: var(--f-display); font-size: 14px; }
.mente .gr rect { fill: var(--surface); stroke-width: 1.5; }
.mente .gr text { font-size: 11.5px; font-weight: 600; }
.mente .hoja text { font-size: 12px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.mente .hoja circle { stroke: var(--surface); stroke-width: 1.5; }
.mente .nodo { cursor: pointer; }
.mente .nodo:hover text { text-decoration: underline; }
.mente path.enlace { fill: none; stroke-width: 1.6; stroke-opacity: .7; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 2000; box-shadow: var(--shadow); }

const $ = (s, r = document) => r.querySelector(s);

const fmt1 = (n) => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');
const esMovil = () => matchMedia('(max-width: 860px)').matches;

function leerColores() {

}
function colorEstado(e) { return e === 'visitado' ? 'var(--visitado)' : e === 'quiero_ir' ? 'var(--quiero)' : e === 'tal_vez' ? 'var(--talvez)' : 'var(--neutro)'; }

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

// ---------- datos ----------
const estadoDe = (id) => S.marcas.get(id)?.estado || null;
function catPrincipal(l) {
  let mejor = TEMATICOS[0];
  for (const t of TEMATICOS) if ((l.puntajes?.[t] ?? 0) > (l.puntajes?.[mejor] ?? 0)) mejor = t;
  if (l.categorias?.includes(mejor)) return mejor;

function pasaFiltro(l) {

function pasaFiltroPropio(p) {

}
const lugaresPais = (iso) => S.lugares.filter((l) => l.pais_iso === iso);
const propiosPais = (iso) => [...S.propios.values()].filter((p) => p.pais_iso === iso);
function conteoEstados(ids, propios = []) {
  const c = { visitado: 0, quiero_ir: 0, tal_vez: 0, sin: 0 };

}

// ---------- geometría ----------
function enAnillo([x, y], a) { let d = false; for (let i = 0, j = a.length - 1; i < a.length; j = i++) { const [xi, yi] = a[i], [xj, yj] = a[j]; if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) d = !d; } return d; }

// ---------- mapa ----------
let mapa, capaPaises, capaBurbujas, cluster, capaAdr, capaFoco;
const marcadores = new Map();
const burbujas = new Map();

function iniciarMapa() {
  mapa = L.map('mapa', { zoomControl: false, zoomSnap: 0.25, minZoom: 2.5, maxZoom: 13, worldCopyJump: false, maxBounds: [[-75, -220], [86, 220]], attributionControl: true, preferCanvas: false });
  mapa.attributionControl.setPrefix('Fronteras: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>');
  L.control.zoom({ position: 'bottomright', zoomInTitle: 'Acercar', zoomOutTitle: 'Alejar' }).addTo(mapa);
  mapa.fitBounds([[35, -11], [62, 32]]);
  // retícula de atlas
  const ret = [];
  for (let la = -60; la <= 80; la += 10) ret.push([[la, -180], [la, 180]]);
  for (let lo = -180; lo <= 180; lo += 10) ret.push([[-75, lo], [85, lo]]);
  L.polyline(ret, { color: C.grat, weight: 0.7, interactive: false, className: 'reticula' }).addTo(mapa);

  capaPaises = L.geoJSON(null, { style: estiloPais, onEachFeature: alPais, smoothFactor: 0.6 }).addTo(mapa);
  capaBurbujas = L.layerGroup().addTo(mapa);
  cluster = L.markerClusterGroup({ showCoverageOnHover: false, spiderfyOnMaxZoom: true, maxClusterRadius: (z) => (z < 7 ? 46 : 32), iconCreateFunction: iconoCluster, chunkedLoading: true });
  capaAdr = L.layerGroup();
  capaFoco = L.layerGroup().addTo(mapa);
  mapa.on('zoomend', alZoom);
  mapa.on('click', alClicMapa);
  mapa.on('popupopen', (e) => {
    e.popup.getElement()?.querySelectorAll('[data-lugar]').forEach((b) => b.addEventListener('click', () => abrirLugar(b.dataset.lugar)));
  });
}

function estiloPais(f) {
  const iso = f.properties.iso, p = S.paises.get(iso);
  if (!p) return { fillColor: C['land-out'], fillOpacity: 1, color: C.border, weight: 0.5, opacity: 0.6 };
  const est = estadoPais(iso), sel = S.pais === iso;
  const fill = { visitado: C.visitado, quiero_ir: C.quiero, tal_vez: C.talvez }[est];
  return {
    fillColor: fill || (p.total_lugares ? C['land-inv'] : C.land),
    fillOpacity: fill ? (S.zAlto ? 0.14 : 0.38) : 1,
    color: sel ? C.accent : C.border, weight: sel ? 2.4 : 0.8, opacity: 1,
  };
}
function alPais(f, capa) {
  const iso = f.properties.iso;
  if (!S.paises.has(iso)) return;
  capa.bindTooltip(() => {
    const p = S.paises.get(iso), c = conteoEstados(lugaresPais(iso).map((l) => l.id), propiosPais(iso));
    const det = p.total_lugares ? `${p.total_lugares} destinos · ${c.visitado} visitados${c.quiero_ir ? ` · ${c.quiero_ir} quiero ir` : ''}` : 'Por investigar';
    return `<b>${esc(p.nombre)}</b><small>${det}</small>`;
  }, { sticky: true, className: 'tt', direction: 'top', offset: [0, -8] });
  capa.on('mouseover', () => { if (S.pais !== iso) capa.setStyle({ weight: 1.8, color: C.accent }); });
  capa.on('mouseout', () => capaPaises.resetStyle(capa));
  capa.on('click', (e) => { if (S.agregando) return; L.DomEvent.stopPropagation(e); seleccionarPais(iso); });
}
function reestilarPaises() { capaPaises.setStyle(estiloPais); capaPaises.eachLayer((l) => { if (l.feature.properties.iso === S.pais) l.bringToFront(); }); }

function crearBurbujas() {
  capaBurbujas.clearLayers(); burbujas.clear();
  const etiqueta = new Map(geoFeatures.map((f) => [f.properties.iso, f.properties]));
  for (const p of S.paises.values()) {
    const g = etiqueta.get(p.iso);
    if (!g || MICRO.has(p.iso)) continue;
    const m = L.marker([g.ly, g.lx], { icon: iconoBurbuja(p), keyboard: false, riseOnHover: true });
    m.on('click', () => seleccionarPais(p.iso));

function iconoBurbuja(p) {

}

function iconoLugar(l) {
  const e = estadoDe(l.id) || 'none', s = TAM[l.nivel] || 20;
  return L.divIcon({ className: 'pin-wrap', iconSize: [s, s], iconAnchor: [s / 2, s / 2], html: `<div class="pin e-${e}" style="--s:${s}px">${G[catPrincipal(l)]}</div><span class="pin-label">${esc(l.nombre)}</span>` });
}
function iconoPropio(p) {

function construirMarcadores() {
  cluster.clearLayers(); marcadores.clear();
  const ms = [];
  for (const l of S.lugares) {
    if (!pasaFiltro(l)) continue;
    const m = L.marker([l.lat, l.lng], { icon: iconoLugar(l), estado: estadoDe(l.id), lugarId: l.id, title: '' });
    m.bindTooltip(`<b>${esc(l.nombre)}</b><small>${NIVELES[l.nivel]} · ${fmt1(l.global)}</small>`, { className: 'tt', direction: 'top', offset: [0, -(TAM[l.nivel] / 2) - 2] });
    m.on('click', () => abrirLugar(l.id));
    marcadores.set(l.id, m); ms.push(m);
  }
  for (const [id, p] of S.propios) {
    if (!pasaFiltroPropio(p)) continue;
    const m = L.marker([p.lat, p.lng], { icon: iconoPropio(p), estado: p.estado || null, title: '' });
    m.bindTooltip(`<b>${esc(p.nombre)}</b><small>Tu lugar</small>`, { className: 'tt', direction: 'top', offset: [0, -13] });

}

    for (const a of l.adrenalina_cerca || []) {
      if (typeof a.lat !== 'number') continue;

      if (vistos.has(k)) continue; vistos.add(k);
      const m = L.marker([a.lat, a.lng], { icon: L.divIcon({ className: 'pin-wrap', iconSize: [22, 22], html: `<div class="adr-pin">${G.adrenalina}</div>` }), zIndexOffset: 500 });
      m.bindTooltip(`<b>${esc(a.nombre)}</b><small>${TIPOS_ADR[a.tipo] || 'Aventura'}</small>`, { className: 'tt', direction: 'top', offset: [0, -12] });
      m.bindPopup(`<div class="pop"><h4>${esc(a.nombre)}</h4><div class="meta">${TIPOS_ADR[a.tipo] || 'Aventura'}${a.temporada ? ' · ' + esc(a.temporada) : ''} · a ${a.km} km de ${esc(l.nombre)}</div><div class="acc"><a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">Sitio oficial ↗</a><button class="btn" data-lugar="${esc(l.id)}">Ver ${esc(l.nombre)}</button></div></div>`);

function alZoom() {
  const z = mapa.getZoom(), el = mapa.getContainer();
  if ((z >= 6.5) !== !!S.zAlto) { S.zAlto = z >= 6.5; reestilarPaises(); }
  el.classList.toggle('z-labels', z >= 8.5);
  el.classList.toggle('z-mid', z >= 5.25);
  const verBurbujas = z < 7;
  if (verBurbujas && !mapa.hasLayer(capaBurbujas)) mapa.addLayer(capaBurbujas);
  if (!verBurbujas && mapa.hasLayer(capaBurbujas)) mapa.removeLayer(capaBurbujas);
  const verPines = z >= 4.75 || S.pais;
  if (verPines && !mapa.hasLayer(cluster)) mapa.addLayer(cluster);
  if (!verPines && mapa.hasLayer(cluster)) mapa.removeLayer(cluster);
}

function relleno() {
  if (!esMovil()) return { paddingTopLeft: [20, 70], paddingBottomRight: [20, 20] };
  return { paddingTopLeft: [16, 60], paddingBottomRight: [16, Math.round(window.innerHeight * 0.48)] };
}
function volarAPais(iso) {
  const ls = lugaresPais(iso);
  let b;
  if (ENCUADRE[iso]) b = L.latLngBounds(ENCUADRE[iso]);
  else if (ls.length > 1) b = L.latLngBounds(ls.map((l) => [l.lat, l.lng]));
  else {
    const f = geoFeatures.find((x) => x.properties.iso === iso);
    if (!f) return;
    const ps = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    const mayor = ps.map((p) => L.latLngBounds(p[0].map(([x, y]) => [y, x]))).sort((a, c) => area(c) - area(a))[0];
    b = mayor;
  }
  if (ls.length) for (const l of ls) if (!ENCUADRE[iso]) b.extend([l.lat, l.lng]);
  mapa.flyToBounds(b.pad(0.08), { ...relleno(), maxZoom: MICRO.has(iso) ? 12 : 8, duration: 1.1 });
}
const area = (b) => (b.getNorth() - b.getSouth()) * (b.getEast() - b.getWest());
function enfocar(lat, lng) {

  L.marker([lat, lng], { icon: L.divIcon({ className: 'pin-wrap', iconSize: [46, 46], html: '<div class="foco"></div>' }), interactive: false, keyboard: false, zIndexOffset: -100 }).addTo(capaFoco);
}
function volarALugar(lat, lng) {
  const z = Math.max(mapa.getZoom(), 9.5);
  if (esMovil()) {
    const pt = mapa.project([lat, lng], z).add([0, window.innerHeight * 0.22]);
    mapa.flyTo(mapa.unproject(pt, z), z, { duration: 0.9 });
  } else mapa.flyTo([lat, lng], z, { duration: 0.9 });
  enfocar(lat, lng);
}

// ---------- navegación ----------
function setHash(h) { try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (_) {} }
function seleccionarPais(iso, { volar = true } = {}) {

  S.pais = iso; S.lugar = null; S.propio = null; S.borrador = null; S.vista = 'pais'; S.colapsados.clear();
  capaFoco.clearLayers(); reestilarPaises(); alZoom();
  if (volar) volarAPais(iso);
  renderPanel(); setHash(iso.toLowerCase()); hoja('media');
}
function abrirLugar(id, { volar = true } = {}) {

  mapa.closePopup();
  S.lugar = id; S.propio = null; S.borrador = null; S.vista = 'lugar';
  if (S.pais !== l.pais_iso) { S.pais = l.pais_iso; reestilarPaises(); }

function abrirPropio(id) {

function volverContinente() {
  S.vista = 'continente'; S.pais = null; S.lugar = null; S.propio = null; S.borrador = null;
  capaFoco.clearLayers(); reestilarPaises();
  mapa.flyToBounds([[35, -11], [62, 32]], { ...relleno(), duration: 1 });

}
function hoja(estado) { if (esMovil()) $('#panel').dataset.hoja = estado; }

// ---------- panel ----------

function avisoDatos() {
  let h = '';
  if (S.muestra) h += '<div class="muestra"><b>Datos de ejemplo.</b> Estos destinos son de prueba mientras los agentes investigan Europa. Se reemplazan en la próxima publicación; tus marcas se conservan.</div>';
  if (S.dbListo && !S.db) h += '<div class="muestra">Esta vista no tiene acceso a la base de datos: puedes explorar, pero tus marcas no se guardarán.</div>';
  return h;
}

function vistaContinente() {
  const ids = S.lugares.map((l) => l.id), c = conteoEstados(ids, [...S.propios.values()]);
  const inv = [...S.paises.values()].filter((p) => p.total_lugares).length;
  const visitados = [...S.paises.keys()].filter((iso) => estadoPais(iso) === 'visitado').length;
  let h = `<div class="grupo"><span class="ceja">Continente</span><h2>${CONTINENTES.map((k) => NOMBRE_CONT[k]).join(' · ')}</h2>
    <span class="sub">${S.paises.size} países · ${inv} investigados · ${S.lugares.length} destinos</span></div>${avisoDatos()}
    <div class="cifras"><div class="cifra"><b>${visitados}</b><span><i class="dot e-visitado"></i>países visitados</span></div>
    <div class="cifra"><b>${c.visitado}</b><span><i class="dot e-visitado"></i>lugares visitados</span></div>
    <div class="cifra"><b>${c.quiero_ir}</b><span><i class="dot e-quiero_ir"></i>quiero ir</span></div></div>`;
  for (const sr of S.subregiones) {
    const filas = sr.paises.map((iso) => S.paises.get(iso)).filter(Boolean).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    h += `<div class="grupo"><h3>${esc(sr.nombre)}</h3><ul class="lista-paises">${filas.map((p) => {
      const cc = conteoEstados(lugaresPais(p.iso).map((l) => l.id), propiosPais(p.iso));
      const der = p.total_lugares ? `<span class="n">${p.total_lugares}</span>${barraEstado(cc, 'mini')}` : '<span class="pend">por investigar</span><span></span>';
      return `<li><button data-pais="${p.iso}"><span>${esc(p.nombre)}</span>${der}</button></li>`;
    }).join('')}</ul></div>`;
  }
  h += `<details class="como"><summary>Cómo se eligen y puntúan los destinos</summary>
    <p>Nueve agentes investigan cada país. Seis puntúan de 0 a 5: consenso de guías (Lonely Planet, Rick Steves, DK Eyewitness, Fodor's, Michelin, Rough Guides y más), cultura, naturaleza, gastronomía, adrenalina y logística.</p>
    <ul><li>Puntaje global = 40 % guías + 45 % el mejor tema + 15 % logística.</li><li>Imprescindible ≥ 4,0 · Muy recomendado ≥ 3,0 · Si hay tiempo ≥ 2,0.</li><li>Mínimo 10 destinos por país (3–6 en microestados) y una nota de revisión ≥ 9,5 / 10.</li></ul></details>`;
  return h;
}

function vistaPais() {

  const c = conteoEstados(todos.map((l) => l.id), propiosPais(p.iso));

  let h = `<button class="volver" data-act="continente">← ${esc(sr?.nombre || 'Continente')}</button>
    <div class="grupo"><span class="ceja">${esc(NOMBRE_CONT[p.continente] || '')}</span><h2>${esc(p.nombre)}</h2>
    <span class="sub">${p.total_lugares ? `${p.total_lugares} destinos` : 'Todavía no investigado'}${typeof p.nota_revisor === 'number' ? ` · revisión ${fmt1(p.nota_revisor)} / 10` : p.total_lugares ? ' · en revisión de calidad' : ''}${p.revision_pendiente ? ' · revisión pendiente' : ''}</span>
    ${p.total_lugares ? barraEstado(c) : ''}</div>${avisoDatos()}`;
  if (p.justificacion) h += `<p class="sub" style="margin:0">${esc(p.justificacion)}</p>`;
  if (!p.total_lugares && !props.length) {
    return h + `<p class="vacio">Los agentes aún no investigan este país. Mientras tanto puedes agregar tus propios lugares.</p><div class="acciones"><button class="btn prim" data-act="agregar">+ Agregar un lugar</button></div>`;
  }
  h += `<div class="tabs" role="tablist"><button role="tab" data-tab="lista" aria-selected="${S.tab === 'lista'}">Lista</button><button role="tab" data-tab="mente" aria-selected="${S.tab === 'mente'}">Mapa mental</button></div>`;
  if (S.tab === 'mente') {
    return h + `<div class="mente-ctl">Agrupar por <div class="seg" id="agrupar">${[['region', 'Región'], ['categoria', 'Categoría'], ['nivel', 'Nivel']].map(([v, t]) => `<button data-agrupar="${v}" aria-pressed="${S.agrupar === v}">${t}</button>`).join('')}</div></div><div class="mente" id="mente"></div>`;
  }
  if (!ls.length && !props.length) h += '<p class="vacio">Ningún destino coincide con los filtros.</p>';
  for (const n of ORDEN_NIVEL) {

  h += `<div class="acciones"><button class="btn" data-act="agregar">+ Agregar un lugar propio</button></div>`;
  return h;
}

    <div class="nota"><b>${fmt1(l.global)}</b><span>de 5</span></div></div>

  const sinEval = new Set(l.sin_evaluar || []);
  h += `<div class="grupo"><h3>Puntajes</h3><div class="barras">${CRIT.map(([k, t]) => sinEval.has(k)
    ? `<div class="barra sin-eval"><span>${t}</span><span class="riel"></span><b title="Ningún agente evaluó este criterio todavía">—</b></div>`

    <div class="grupo"><h3>Mejor época</h3><div class="meses" role="img" aria-label="Mejores meses: ${l.mejor_epoca.map((x) => MESES_L[x - 1]).join(', ')}">${MESES.map((t, i) => `<span class="${l.mejor_epoca.includes(i + 1) ? 'si' : ''}">${t[0]}</span>`).join('')}</div></div>
    <dl class="datos"><div><dt>Días sugeridos</dt><dd>${l.dias_sugeridos} ${l.dias_sugeridos === 1 ? 'día' : 'días'}</dd></div><div><dt>Costo</dt><dd>${esc(l.costo)}</dd></div>
    ${l.acceso ? `<div style="grid-column:1/-1"><dt>Cómo llegar</dt><dd style="font-weight:500">${esc(l.acceso)}</dd></div>` : ''}</dl>`;
  if (l.platos?.length) h += `<div class="grupo"><h3>Qué probar</h3><div class="chips">${l.platos.map((p) => `<span class="chip">${esc(p)}</span>`).join('')}</div></div>`;
  if (l.adrenalina_cerca?.length) h += `<div class="grupo"><h3>Adrenalina cerca</h3><ul class="adr-lista">${[...l.adrenalina_cerca].sort((a, b) => a.km - b.km).map((a) => `<li><span class="ico">${G.adrenalina}</span><span><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.nombre)}</a><small>${TIPOS_ADR[a.tipo] || 'Aventura'}${a.temporada ? ' · ' + esc(a.temporada) : ''}</small></span><span class="km">${a.km} km</span></li>`).join('')}</ul></div>`;
  h += `<div class="grupo"><h3>Fuentes</h3><ul class="fuentes">${l.fuentes.map((f) => { let d = ''; try { d = new URL(f.url).hostname.replace(/^www\./, ''); } catch (_) {} return `<li><a href="${esc(f.url)}" target="_blank" rel="noopener"><span>${esc(f.guia)}</span><small>${esc(d)} ↗</small></a></li>`; }).join('')}</ul></div>
    <div class="acciones"><button class="btn" data-act="ver">Centrar en el mapa</button></div>`;

function actualizarFicha() {

// ---------- mapa mental (D3) ----------
function dibujarMente() {
  const cont = $('#mente'); if (!cont || !window.d3) return;
  const p = S.paises.get(S.pais);
  const ls = lugaresPais(p.iso).filter(pasaFiltro), props = propiosPais(p.iso).filter(pasaFiltroPropio);
  const clave = S.agrupar === 'region' ? (l) => l.region : S.agrupar === 'categoria' ? (l) => CATS[catPrincipal(l)] : (l) => NIVELES[l.nivel];
  const mapaG = d3.group(ls, clave);
  let grupos = [...mapaG].map(([k, v]) => ({ k, hijos: v.sort((a, b) => b.global - a.global).map((l) => ({ id: l.id, nombre: l.nombre, estado: estadoDe(l.id), lugar: true })) }));
  grupos.sort((a, b) => (S.agrupar === 'nivel' ? ORDEN_NIVEL.indexOf(Object.keys(NIVELES).find((x) => NIVELES[x] === a.k)) - ORDEN_NIVEL.indexOf(Object.keys(NIVELES).find((x) => NIVELES[x] === b.k)) : b.hijos.length - a.hijos.length));
  if (props.length) grupos.push({ k: 'Tus lugares', hijos: props.map((q) => ({ id: 'propio:' + q._id, nombre: q.nombre, estado: q.estado || null, propio: q._id })) });
  if (!grupos.length) { cont.innerHTML = '<p class="vacio">Ningún destino coincide con los filtros.</p>'; return; }

  // árbol que baja desde el país: tronco a la izquierda, ramas (grupos) y hojas (lugares)
  const W = Math.max(300, cont.clientWidth || 360), FILA = 25, TX = 16, GL = 36, Y0 = 52;
  const MAXGW = Math.min(180, Math.round(W * 0.42)), LX = GL + MAXGW + 22;
  const maxCh = Math.max(10, Math.floor((W - LX - 14) / 6.4)), maxG = Math.max(8, Math.floor((MAXGW - 18) / 6.6) - 4);
  const corta = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
  const anchoG = (g) => Math.min(MAXGW, (corta(g.k, maxG) + ` · ${g.hijos.length}`).length * 6.6 + 18);
  let y = Y0;
  const nodos = [], enlaces = [];
  grupos.forEach((g, i) => {
    const col = `var(--rama${(i % 6) + 1})`, abierto = !S.colapsados.has(g.k), w = anchoG(g);
    const y0 = y;
    if (abierto) for (const h of g.hijos) { nodos.push({ ...h, x: LX, y, col, grupo: g.k, key: h.id }); y += FILA; }
    else y += FILA;
    const gy = abierto ? (y0 + y - FILA) / 2 : y0;
    g.y = gy; g.col = col; g.abierto = abierto;
    nodos.push({ key: 'g:' + g.k, x: GL, y: gy, w, nombre: g.k, n: g.hijos.length, col, esGrupo: true, abierto });
    if (abierto) for (const h of g.hijos) enlaces.push({ key: 'e:' + h.id, s: [GL + w, gy], t: [LX - 6, nodos.find((n) => n.key === h.id).y], col });
    enlaces.push({ key: 'r:' + g.k, codo: true, s: [TX, 30], t: [GL, gy], col });
    y += 10;
  });
  const H = y + 6;
  const curva = d3.linkHorizontal().source((d) => d.s).target((d) => d.t);
  const link = (d) => {
    if (!d.codo) return curva(d);
    const [sx, sy] = d.s, [tx, ty] = d.t, r = Math.min(10, Math.max(0, ty - sy));
    return `M${sx},${sy}V${ty - r}Q${sx},${ty} ${sx + r},${ty}H${tx}`;
  };
  const dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 450;

  let svg = d3.select(cont).select('svg');
  if (svg.empty() || +svg.attr('data-w') !== W || svg.attr('data-pais') !== p.iso || svg.attr('data-agr') !== S.agrupar) {
    cont.innerHTML = '';
    svg = d3.select(cont).append('svg').attr('data-w', W).attr('data-pais', p.iso).attr('data-agr', S.agrupar).attr('role', 'img').attr('aria-label', `Mapa mental de ${p.nombre}`);
    svg.append('g').attr('class', 'enlaces'); svg.append('g').attr('class', 'nodos');
  }
  svg.transition().duration(dur).attr('viewBox', `0 0 ${W} ${H}`);

  const es = svg.select('g.enlaces').selectAll('path').data(enlaces, (d) => d.key);
  es.exit().transition().duration(dur).attr('stroke-opacity', 0).remove();
  es.enter().append('path').attr('class', 'enlace').style('stroke', (d) => d.col)
    .attr('d', (d) => link({ ...d, t: d.codo ? [d.s[0], d.s[1]] : d.s })).attr('stroke-opacity', 0)
    .merge(es).transition().duration(dur).attr('d', link).attr('stroke-opacity', 0.75);

  const ns = svg.select('g.nodos').selectAll('g.nodo').data(nodos, (d) => d.key);
  ns.exit().transition().duration(dur).attr('opacity', 0).remove();
  const ne = ns.enter().append('g').attr('class', (d) => 'nodo ' + (d.esGrupo ? 'gr' : 'hoja'))
    .attr('transform', (d) => (d.esGrupo ? `translate(${GL},${Y0 - 20})` : `translate(${GL + MAXGW / 2},${grupos.find((g) => g.k === d.grupo)?.y ?? d.y})`)).attr('opacity', 0)
    .on('click', (ev, d) => {
      if (d.esGrupo) { S.colapsados.has(d.nombre) ? S.colapsados.delete(d.nombre) : S.colapsados.add(d.nombre); dibujarMente(); }
      else if (d.propio) abrirPropio(d.propio); else abrirLugar(d.id);
    });
  ne.filter((d) => d.esGrupo).each(function (d) {
    const g = d3.select(this), t = corta(d.nombre, maxG) + ` · ${d.n}`;
    g.append('rect').attr('x', 0).attr('y', -11).attr('width', d.w).attr('height', 22).attr('rx', 11).style('stroke', d.col);
    g.append('text').attr('x', d.w / 2).attr('text-anchor', 'middle').attr('dy', '0.35em').text(t).append('title').text(d.nombre);
  });
  ne.filter((d) => !d.esGrupo).each(function (d) {
    const g = d3.select(this);
    g.append('circle').attr('r', 6);
    g.append('text').attr('x', 11).attr('dy', '0.35em').text(corta(d.nombre, maxCh)).append('title').text(d.nombre);
  });
  const todos = ne.merge(ns);
  todos.select('circle').style('fill', (d) => colorEstado(d.estado));
  todos.filter((d) => d.esGrupo).select('rect').style('fill', (d) => (d.abierto ? 'var(--surface)' : `color-mix(in srgb, ${d.col} 18%, var(--surface))`));
  todos.transition().duration(dur).attr('transform', (d) => `translate(${d.x},${d.y})`).attr('opacity', 1);

  if (svg.select('g.raiz').empty()) {
    const raiz = svg.append('g').attr('class', 'nodo raiz').on('click', () => volarAPais(p.iso));
    const w = Math.min(W - 4, p.nombre.length * 8.6 + 28);
    raiz.append('rect').attr('x', 1).attr('y', 1).attr('width', w).attr('height', 30).attr('rx', 15);
    raiz.append('text').attr('x', 1 + w / 2).attr('y', 16).attr('text-anchor', 'middle').attr('dy', '0.35em').text(p.nombre);
  }
  svg.select('g.raiz').raise();
}

// ---------- marcas (base de datos) ----------
const colas = new Map();
function encolar(clave, op) {
  const p = (colas.get(clave) || Promise.resolve()).then(op).catch((e) => {
    console.error(e);
    if (e?.code === 'invalid_argument') { S.soloLectura = true; toast('No tienes permiso para guardar cambios en este mapa'); }
    else if (e?.code === 'quota_exceeded') toast('La base de datos está llena: no se pudo guardar');
    else toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo');
  });
  colas.set(clave, p); return p;
}
function guardarMarca(id, cambios) {
  const prev = S.marcas.get(id) || {};
  const nueva = { estado: prev.estado ?? null, fecha_visita: prev.fecha_visita ?? null, notas: prev.notas ?? '', ...cambios };
  if (nueva.estado !== 'visitado') nueva.fecha_visita = null;
  const vacia = !nueva.estado && !nueva.notas;
  if (vacia) S.marcas.delete(id); else S.marcas.set(id, { ...nueva, actualizado: new Date().toISOString() });
  trasCambio(id);
  if (!S.db) { if (S.dbListo) toast('Sin base de datos: este cambio no se guardará'); return; }
  const ref = S.db.collection('marcas').doc(id);
  encolar('m:' + id, () => (vacia ? ref.delete() : ref.set(S.marcas.get(id))));
}
function guardarPropio(id, cambios) {
  const prev = S.propios.get(id); if (!prev) return;
  const nuevo = { ...prev, ...cambios };
  if (nuevo.estado !== 'visitado') nuevo.fecha_visita = null;
  S.propios.set(id, nuevo);
  trasCambio(null);
  if (!S.db) return;
  const { _id, ...cuerpo } = nuevo;
  encolar('p:' + id, () => S.db.collection('lugares_propios').doc(id).set({ ...cuerpo, actualizado: new Date().toISOString() }));
}
function trasCambio(id) {
  if (id) actualizarMarcador(id); else construirMarcadores();
  reestilarPaises(); actualizarBurbujas(); refrescarPanel();
  if (S.vista === 'pais' && S.tab === 'mente') dibujarMente();
}
async function conectarDb() {
  let db = null;
  try { db = await window.claude?.use?.('db'); } catch (_) { db = null; }
  S.dbListo = true; S.db = db || null;
  if (!db) { refrescarPanel(); return; }
  try {
    const user = await window.claude.use('user');
    const puede = user ? await user.can?.('data.write') : null;
    if (puede === false) S.soloLectura = true;
  } catch (_) {}
  db.collection('marcas').onSnapshot((snap) => {
    const cambiados = snap.docChanges().map((c) => c.doc.id);
    const nuevo = new Map(snap.docs.map((d) => [d.id, d.data()]));
    for (const [id, m] of S.marcas) if (!nuevo.has(id) && colas.has('m:' + id)) nuevo.set(id, m);
    S.marcas = nuevo;
    if (cambiados.length > 20) construirMarcadores(); else cambiados.forEach((id) => S.porId.has(id) && actualizarMarcador(id));
    reestilarPaises(); actualizarBurbujas(); refrescarPanel();
  }, (e) => console.error('marcas', e));
  db.collection('lugares_propios').onSnapshot((snap) => {
    S.propios = new Map(snap.docs.map((d) => [d.id, { ...d.data(), _id: d.id }]));
    construirMarcadores(); reestilarPaises(); actualizarBurbujas(); refrescarPanel();
  }, (e) => console.error('lugares_propios', e));
}

// ---------- agregar lugares propios ----------
function modoAgregar(on) {
  if (S.soloLectura && on) return toast('No tienes permiso para agregar lugares en este mapa');
  S.agregando = on;
  $('#app').classList.toggle('agregando', on);
  $('#aviso-agregar').hidden = !on;
  if (on) hoja('peek');
}
function alClicMapa(e) {
  if (!S.agregando) return;
  modoAgregar(false);
  const { lat, lng } = e.latlng;
  S.borrador = { lat, lng, pais_iso: paisEnPunto(lat, lng), estado: 'quiero_ir' };
  S.vista = 'nuevo'; enfocar(lat, lng); renderPanel(); hoja('llena');
  setTimeout(() => $('#nuevo-nombre')?.focus(), 50);
}
async function crearPropio(datos) {
  const doc = { ...datos, creado: new Date().toISOString() };
  let id;
  if (S.db) {
    const ref = S.db.collection('lugares_propios').doc();
    id = ref.id;
    S.propios.set(id, { ...doc, _id: id });
    encolar('p:' + id, () => ref.set(doc));
  } else {
    id = 'local-' + Date.now();
    S.propios.set(id, { ...doc, _id: id });
    if (S.dbListo) toast('Sin base de datos: este lugar no se guardará');
  }
  construirMarcadores(); reestilarPaises(); actualizarBurbujas();
  abrirPropio(id);
}

// ---------- búsqueda ----------
let sugs = [], sugSel = 0;
function buscar(q) {
  const n = norm(q).trim(), ul = $('#sug');
  if (n.length < 2) { ul.hidden = true; $('#q').setAttribute('aria-expanded', 'false'); return; }
  const ps = [...S.paises.values()].filter((p) => norm(p.nombre).includes(n)).slice(0, 4).map((p) => ({ t: 'pais', id: p.iso, nombre: p.nombre, det: p.total_lugares ? `${p.total_lugares} destinos` : 'por investigar' }));
  const ls = S.lugares.filter((l) => norm(l.nombre).includes(n) || norm(l.region).includes(n)).sort((a, b) => (norm(b.nombre).startsWith(n) - norm(a.nombre).startsWith(n)) || b.global - a.global).slice(0, 8)
    .map((l) => ({ t: 'lugar', id: l.id, nombre: l.nombre, det: `${l.region}, ${l.pais}`, e: estadoDe(l.id) }));
  sugs = [...ps, ...ls]; sugSel = 0;
  ul.innerHTML = sugs.length ? sugs.map((s, i) => `<li role="option" data-i="${i}" aria-selected="${i === 0}"><i class="dot ${s.e ? 'e-' + s.e : ''}" ${s.t === 'pais' ? 'style="border-radius:2px"' : ''}></i>${esc(s.nombre)}<small>${esc(s.det)}</small></li>`).join('') : '<li aria-disabled="true">Sin resultados</li>';
  ul.hidden = false; $('#q').setAttribute('aria-expanded', 'true');
}
function elegirSug(i) {
  const s = sugs[i]; if (!s) return;
  $('#sug').hidden = true; $('#q').value = ''; $('#q').blur();
  s.t === 'pais' ? seleccionarPais(s.id) : abrirLugar(s.id);
}

// ---------- eventos ----------
function eventos() {
  $('#cuerpo').addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-lugar]'); if (!t) return;
    if (t.dataset.pais) return seleccionarPais(t.dataset.pais);
    if (t.dataset.lugar) return abrirLugar(t.dataset.lugar);
    if (t.dataset.propio) return abrirPropio(t.dataset.propio);
    if (t.dataset.tab) { S.tab = t.dataset.tab; return renderPanel(); }
    if (t.dataset.agrupar) { S.agrupar = t.dataset.agrupar; S.colapsados.clear(); return renderPanel(); }
    if (t.dataset.nuevoEstado) {
      S.borrador.estado = S.borrador.estado === t.dataset.nuevoEstado ? null : t.dataset.nuevoEstado;
      document.querySelectorAll('[data-nuevo-estado]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.nuevoEstado === S.borrador.estado)));
      $('#nuevo-campo-fecha').hidden = S.borrador.estado !== 'visitado'; return;
    }
    if (t.dataset.estado) {
      if (S.soloLectura) return;
      const actual = S.vista === 'lugar' ? estadoDe(S.lugar) : S.propios.get(S.propio)?.estado;
      const nuevo = actual === t.dataset.estado ? null : t.dataset.estado;
      S.vista === 'lugar' ? guardarMarca(S.lugar, { estado: nuevo }) : guardarPropio(S.propio, { estado: nuevo });
      if (nuevo === 'visitado') setTimeout(() => $('#fecha')?.focus(), 30);
      return;
    }
    const act = t.dataset.act;
    if (act === 'continente') return volverContinente();
    if (act === 'pais') return seleccionarPais(S.pais, { volar: true });
    if (act === 'agregar') return modoAgregar(true);
    if (act === 'cancelar-nuevo') { S.borrador = null; capaFoco.clearLayers(); S.vista = S.pais ? 'pais' : 'continente'; return renderPanel(); }
    if (act === 'ver') { const x = S.vista === 'lugar' ? S.porId.get(S.lugar) : S.propios.get(S.propio); if (x) volarALugar(x.lat, x.lng); return; }
    if (act === 'borrar') { $('#confirmar').hidden = false; return; }
    if (act === 'borrar-no') { $('#confirmar').hidden = true; return; }
    if (act === 'borrar-si') {
      const id = S.propio; S.propios.delete(id); S.propio = null;
      if (S.db) encolar('p:' + id, () => S.db.collection('lugares_propios').doc(id).delete());
      construirMarcadores(); reestilarPaises(); actualizarBurbujas(); toast('Lugar eliminado');
      return S.pais ? seleccionarPais(S.pais, { volar: false }) : volverContinente();
    }
  });
  let notasT;
  $('#cuerpo').addEventListener('input', (e) => {
    if (e.target.id === 'notas' || e.target.id === 'propio-nombre') {
      clearTimeout(notasT);
      const el = e.target;
      notasT = setTimeout(() => guardarTexto(el), 900);
    }
  });
  $('#cuerpo').addEventListener('change', (e) => {
    if (e.target.id === 'fecha') S.vista === 'lugar' ? guardarMarca(S.lugar, { fecha_visita: e.target.value || null }) : guardarPropio(S.propio, { fecha_visita: e.target.value || null });
    if (e.target.id === 'notas' || e.target.id === 'propio-nombre') { clearTimeout(notasT); guardarTexto(e.target); }
  });
  $('#cuerpo').addEventListener('submit', (e) => {
    if (e.target.id !== 'form-nuevo') return;
    e.preventDefault();
    const nombre = $('#nuevo-nombre').value.trim(); if (!nombre) return;
    const b = S.borrador;
    crearPropio({ nombre, lat: +b.lat.toFixed(5), lng: +b.lng.toFixed(5), pais_iso: b.pais_iso, estado: b.estado || null, fecha_visita: b.estado === 'visitado' ? ($('#nuevo-fecha').value || null) : null, notas: $('#nuevo-notas').value.trim() });
  });
  // filtros
  $('#f-estado').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    S.filtros.estado = b.dataset.v;
    $('#f-estado').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    alFiltrar();
  });
  const sm = $('#f-mes'); MESES_L.forEach((m, i) => sm.insertAdjacentHTML('beforeend', `<option value="${i + 1}">Ideal en ${m}</option>`));
  for (const [id, k] of [['#f-cat', 'cat'], ['#f-nivel', 'nivel'], ['#f-mes', 'mes']]) $(id).addEventListener('change', (e) => { S.filtros[k] = e.target.value; alFiltrar(); });
  $('#f-adr').addEventListener('click', (e) => {
    S.adrenalina = !S.adrenalina; e.currentTarget.setAttribute('aria-pressed', String(S.adrenalina));
    S.adrenalina ? mapa.addLayer(capaAdr) : mapa.removeLayer(capaAdr);
    if (S.adrenalina && !capaAdr.getLayers().length) toast('Aún no hay actividades de adrenalina con estos filtros');
  });
  $('#cancelar-agregar').addEventListener('click', () => modoAgregar(false));
  // búsqueda
  const q = $('#q');
  q.addEventListener('input', () => buscar(q.value));
  q.addEventListener('keydown', (e) => {
    const ul = $('#sug'); if (ul.hidden) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sugSel = (sugSel + (e.key === 'ArrowDown' ? 1 : -1) + sugs.length) % sugs.length; ul.querySelectorAll('li').forEach((li, i) => li.setAttribute('aria-selected', String(i === sugSel))); }
    else if (e.key === 'Enter') { e.preventDefault(); elegirSug(sugSel); }
    else if (e.key === 'Escape') { ul.hidden = true; }
  });
  $('#sug').addEventListener('mousedown', (e) => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); elegirSug(+li.dataset.i); } });
  q.addEventListener('blur', () => setTimeout(() => { $('#sug').hidden = true; }, 120));
  // hoja móvil
  $('#asa').addEventListener('click', () => { const p = $('#panel'); p.dataset.hoja = p.dataset.hoja === 'llena' ? 'peek' : p.dataset.hoja === 'media' ? 'llena' : 'media'; });
  // tema
  const retema = () => { leerColores(); reestilarPaises(); mapa.eachLayer((l) => { if (l.options?.className === 'reticula') l.setStyle({ color: C.grat }); }); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', retema);
  new MutationObserver(retema).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { mapa.invalidateSize(); if (S.vista === 'pais' && S.tab === 'mente') dibujarMente(); }, 150); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.agregando) modoAgregar(false); });
}
function guardarTexto(el) {
  if (el.id === 'notas') S.vista === 'lugar' ? guardarMarca(S.lugar, { notas: el.value.trim() }) : guardarPropio(S.propio, { notas: el.value.trim() });
  if (el.id === 'propio-nombre' && el.value.trim()) guardarPropio(S.propio, { nombre: el.value.trim() });
}
function alFiltrar() { construirMarcadores(); refrescarPanel(); if (S.vista === 'pais' && S.tab === 'mente') dibujarMente(); }

// ---------- arranque ----------
async function cargarJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }
async function iniciar() {
  leerColores();
  if (!window.L || !window.d3) { $('#cuerpo').innerHTML = '<p class="vacio">No se pudieron cargar las librerías del mapa. Recarga la página.</p>'; return; }
  iniciarMapa(); eventos();
  conectarDb();
  $('#cont-nombre').textContent = '· ' + CONTINENTES.map((k) => NOMBRE_CONT[k]).join(' · ');
  let geo, conts;
  try { [geo, ...conts] = await Promise.all([cargarJSON('paises.geojson'), ...CONTINENTES.map((c) => cargarJSON(c + '.json'))]); }
  catch (e) { console.error(e); $('#cuerpo').innerHTML = '<p class="vacio">No se pudieron cargar los datos del atlas. Recarga la página.</p>'; return; }
  for (const d of conts) {
    if (d.muestra) S.muestra = true;
    for (const sr of d.subregiones) S.subregiones.push(sr);
    for (const p of d.paises) S.paises.set(p.iso, { ...p, continente: d.continente });
    for (const l of d.lugares) { S.lugares.push(l); S.porId.set(l.id, l); }
  }
  geoFeatures = geo.features;
  capaPaises.addData(geo);
  crearBurbujas(); construirMarcadores(); alZoom(); renderPanel();
  // fronteras detalladas (1:10m) en segundo plano
  for (const c of CONTINENTES) cargarJSON(`detalle-${c}.geojson`).then((det) => {
    const props = new Map(geo.features.map((f) => [f.properties.iso, f.properties]));
    const isos = new Set(det.features.map((f) => f.properties.iso));
    capaPaises.eachLayer((l) => { if (isos.has(l.feature.properties.iso)) capaPaises.removeLayer(l); });
    for (const f of det.features) f.properties = { ...props.get(f.properties.iso), ...f.properties };
    geoFeatures = [...det.features, ...geoFeatures.filter((f) => !isos.has(f.properties.iso))];
    capaPaises.addData(det); reestilarPaises();
  }).catch(() => {});
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && S.porId.has(h)) abrirLugar(h);
  else if (h && S.paises.has(h.toUpperCase())) seleccionarPais(h.toUpperCase());
}
iniciar();
</script>
